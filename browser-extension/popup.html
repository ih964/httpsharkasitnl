<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harkas Password Manager</title><link rel="stylesheet" href="popup.css"><main><header><span class="logo">H</span><div><h1>Harkas Password Manager</h1><p>Gekoppeld aan Harkas Admin</p></div></header><p id="status" role="status">Status laden…</p><button id="fill">Gegevens invullen</button><button id="save" class="secondary">Account opslaan of bijwerken</button><details><summary>Wachtwoordgenerator</summary><label for="length">Lengte</label><select id="length"><option>16</option><option selected>24</option><option>32</option><option>48</option></select><input id="generated" type="password" readonly aria-label="Gegenereerd wachtwoord" autocomplete="off"><button id="generate" class="secondary">Genereer wachtwoord</button><div class="actions"><button id="reveal" class="secondary" disabled>Tonen</button><button id="copy" class="secondary" disabled>Kopiëren</button></div></details><button id="sync" class="secondary">Websites synchroniseren</button><button id="enable" class="secondary" disabled>Herkenning / nieuwe sites toestaan</button><p class="note">Je kiest een account in Harkas Admin. Wachtwoorden en sessietokens worden niet opgeslagen door de extensie.</p><button id="forget" class="link">Koppelingen en herkenning wissen</button></main><script type="module" src="popup.js"></script></html>
