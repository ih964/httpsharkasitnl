name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Release 1 static security gate
        run: npm run release:gate

      - name: Release 1 typecheck
        run: npm run typecheck:release1

      - name: Release 1 blocking lint
        run: npm run lint:release1

      - name: Run assessment tests
        run: npm test

      - name: Full repository lint debt report
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build
