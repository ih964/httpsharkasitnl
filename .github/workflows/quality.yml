name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Release 1 static security gate
        run: npm run release:gate

      - name: Release 1 typecheck
        id: release_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:release1 2>&1 | tee release1-typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-typecheck-log
          path: release1-typecheck.log
          retention-days: 1

      - name: Release 1 blocking lint
        id: release_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:release1 2>&1 | tee release1-lint.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release1-lint-log
          path: release1-lint.log
          retention-days: 1

      - name: Run assessment tests
        run: npm test

      - name: Full repository lint debt report
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Enforce Release 1 blocking checks
        if: always()
        shell: bash
        run: |
          test "${{ steps.release_typecheck.outcome }}" = "success"
          test "${{ steps.release_lint.outcome }}" = "success"
