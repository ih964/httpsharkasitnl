name: Probe TankPuls country size
on:
  push:
    paths:
      - '.github/workflows/probe-tankpuls-sort.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Germany large limit
        run: |
          python - <<'PY'
          import urllib.request, json, time
          url='https://api.tankpuls.de/api/search/cheapest?minLat=47.2&minLng=5.5&maxLat=55.1&maxLng=15.6&fuel=e10&limit=20000'
          req=urllib.request.Request(url,headers={'User-Agent':'HarkasIT/1.0','Accept':'application/json'})
          t=time.time()
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read()
          data=json.loads(raw)
          prices=[i.get('priceCents') for i in data.get('items',[])]
          print('SECS',round(time.time()-t,2),'BYTES',len(raw),'COUNT',data.get('count'),'ITEMS',len(prices),'FIRST',prices[:3],'LAST',prices[-3:])
          PY
