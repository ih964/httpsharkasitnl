name: Probe TankPuls pagination
on:
  push:
    paths:
      - '.github/workflows/probe-tankpuls-sort.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test pagination
        run: |
          python - <<'PY'
          import urllib.request, json
          base='https://api.tankpuls.de/api/search/cheapest?minLat=52.45&minLng=13.25&maxLat=52.60&maxLng=13.55&fuel=e10'
          tests=[
            'limit=500',
            'limit=50&offset=50',
            'limit=50&page=2',
            'limit=50&skip=50'
          ]
          for extra in tests:
              url=base+'&'+extra
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'HarkasIT/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  prices=[i.get('priceCents') for i in data.get('items',[])]
                  print('TEST',extra,'COUNT',data.get('count'),'ITEMS',len(prices),'FIRST',prices[:3],'LAST',prices[-3:])
              except Exception as e:
                  print('ERR',extra,repr(e))
          PY
