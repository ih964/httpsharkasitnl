name: Build Instagram media

on:
  push:
    branches: [main]
    paths:
      - "public/social-src/**"
      - ".github/workflows/build-instagram-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render social media
        run: |
          mkdir -p public/social/instagram
          rsvg-convert -w 1080 -h 1080 public/social-src/instagram-m365.svg -o /tmp/instagram-m365.png
          convert /tmp/instagram-m365.png -background white -alpha remove -alpha off -quality 92 public/social/instagram/instagram-m365.jpg
      - name: Commit generated media
        run: |
          if git diff --quiet -- public/social/instagram/instagram-m365.jpg && git ls-files --error-unmatch public/social/instagram/instagram-m365.jpg >/dev/null 2>&1; then
            echo "No media changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social/instagram/instagram-m365.jpg
          git commit -m "Generate Instagram media"
          git push
