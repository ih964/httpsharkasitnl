name: Export Harkas IT logo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-logo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: harkas-it-logo
          path: src/assets/logo.png
          if-no-files-found: error
          compression-level: 0
