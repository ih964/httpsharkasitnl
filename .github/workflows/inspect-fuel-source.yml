name: Inspect fuel source
on:
  push:
    paths:
      - '.github/workflows/inspect-fuel-source.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source and Nuxt payload
        run: |
          python - <<'PY'
          import re, json, urllib.request
          UA = 'Mozilla/5.0 (compatible; HarkasIT-Debug/1.0)'
          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':UA,'Accept':'text/html,application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          html=get('https://spritpreisverlauf.at/de/tankstellen')
          print('HTML_LENGTH',len(html))
          m=re.search(r'href="([^"]*/de/tankstellen/_payload\.json[^"]*)"',html)
          if not m:
              m=re.search(r'href="(/de/tankstellen/_payload\.json[^"]*)"',html)
          print('PAYLOAD_HREF',m.group(1) if m else 'NONE')
          if m:
              href=m.group(1)
              url=href if href.startswith('http') else 'https://spritpreisverlauf.at'+href
              payload=get(url)
              print('PAYLOAD_LENGTH',len(payload))
              print('PAYLOAD_HEAD',payload[:12000])
              for needle in ['15042','Access Saarbruecken','diesel','super95','stations','lat','lng','api']:
                  p=payload.lower().find(needle.lower())
                  print('\n=== PAYLOAD',needle,'===',p)
                  print(payload[max(0,p-1200):p+5000] if p>=0 else 'NOT FOUND')
          for needle in ['fetch(','$fetch','/api/','stations?','loadMore','Mehr anzeigen','pageSize','offset','sortBy','selectedFuel']:
              p=html.lower().find(needle.lower())
              print('\n=== HTML',needle,'===',p)
              print(html[max(0,p-1200):p+5000] if p>=0 else 'NOT FOUND')
          PY
