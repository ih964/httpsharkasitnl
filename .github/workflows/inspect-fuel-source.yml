name: Inspect fuel source
on:
  push:
    paths:
      - '.github/workflows/inspect-fuel-source.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nationwide Germany filters
        run: |
          python - <<'PY'
          import re, json, urllib.request
          UA='Mozilla/5.0 (compatible; HarkasIT-Debug/1.0)'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode('utf-8','replace')
          html=get('https://spritpreisverlauf.at/de/tankstellen')
          m=re.search(r'href="(/de/tankstellen/_payload\.json[^"]*)"',html)
          vals=json.loads(get('https://spritpreisverlauf.at'+m.group(1)))
          memo={}
          def ref(i):
              if not isinstance(i,int): return i
              if i < 0: return None
              if i in memo: return memo[i]
              node=vals[i]
              if isinstance(node,list):
                  if node and isinstance(node[0],str) and node[0] in ('ShallowReactive','Reactive','Ref','ShallowRef'):
                      out=ref(node[1]); memo[i]=out; return out
                  out=[]; memo[i]=out; out.extend(ref(x) if isinstance(x,int) else x for x in node); return out
              if isinstance(node,dict):
                  out={}; memo[i]=out
                  for k,v in node.items(): out[k]=ref(v) if isinstance(v,int) else v
                  return out
              memo[i]=node; return node
          stations=ref(0)['data']['all-stations']
          for field in ('diesel','super95'):
              valid=[s for s in stations if isinstance(s.get(field),(int,float)) and not isinstance(s.get(field),bool) and 1 <= s[field] <= 5]
              valid.sort(key=lambda x:x[field])
              print('\nFIELD',field)
              for s in valid[:15]:
                  print(json.dumps({k:s.get(k) for k in ['name','address','postalCode','city',field,field+'ChangedAt','lastUpdatedAt','priceStale',field+'Floor','bundesland','slug']},ensure_ascii=False))
          PY
