name: Inspect fuel source
on:
  push:
    paths:
      - '.github/workflows/inspect-fuel-source.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        run: |
          curl -L --fail --silent --show-error \
            -A 'Mozilla/5.0 (compatible; HarkasIT-Debug/1.0)' \
            'https://spritpreisverlauf.at/de/tankstellen' \
            -o source.html
          python - <<'PY'
          from pathlib import Path
          html = Path('source.html').read_text(errors='replace')
          print('LENGTH', len(html))
          for needle in ['Mehr anzeigen','Super E5','Diesel','sort','fuel','api/','__NEXT_DATA__','application/ld+json']:
              print('\n===', needle, '===')
              p=html.lower().find(needle.lower())
              print(html[max(0,p-1200):p+3500] if p>=0 else 'NOT FOUND')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-html
          path: source.html
