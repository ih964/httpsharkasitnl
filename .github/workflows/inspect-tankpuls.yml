name: Inspect TankPuls web app
on:
  push:
    paths:
      - '.github/workflows/inspect-tankpuls.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe nationwide TankPuls bbox
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, time
          for fuel in ['e10','e5','diesel']:
              url=f'https://api.tankpuls.de/api/search/cheapest?minLat=47.2&minLng=5.5&maxLat=55.1&maxLng=15.6&fuel={fuel}&limit=5'
              r=urllib.request.Request(url,headers={'User-Agent':'HarkasIT/1.0','Accept':'application/json'})
              try:
                  t=time.time()
                  with urllib.request.urlopen(r,timeout=25) as x:
                      body=x.read().decode('utf-8','replace')
                      print(fuel,'STATUS',x.status,'SECS',round(time.time()-t,2),'LEN',len(body),body[:5000])
              except urllib.error.HTTPError as e:
                  print(fuel,'HTTP',e.code,e.read().decode('utf-8','replace')[:3000])
              except Exception as e:
                  print(fuel,'ERR',repr(e))
          PY
